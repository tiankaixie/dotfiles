# NERV Theme for Starship
# Inspired by 80s/90s cyberpunk interfaces and Evangelion's NERV headquarters

format = """\
[ 󰀵  ](fg:#0a1612 bg:#e85d04 bold)\
[](fg:#e85d04 bg:#8fb3a5)\
$time\
[](fg:#8fb3a5 bg:#0f1f1a)\
$directory\
[](fg:#0f1f1a bg:#3a7a8c)\
$git_branch\
[](fg:#3a7a8c)\
$git_status\
$character\
"""

[directory]
format = "[ $path ]($style)"
style = "fg:#a8d3c5 bg:#0f1f1a"
truncation_length = 3
truncate_to_repo = true

[git_branch]
format = '[ $symbol$branch(:$remote_branch) ]($style)'
symbol = "  "
style = "fg:#a8d3c5 bg:#3a7a8c"

[git_status]
format = "[ $all_status$ahead_behind ]($style)"
style = "fg:#e85d04 bold"
conflicted = "⚔️ "
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇕⇡${ahead_count}⇣${behind_count} "
up_to_date = ""
untracked = "?${count} "
stashed = "📦 "
modified = "!${count} "
staged = "+${count} "
renamed = "»${count} "
deleted = "✘${count} "

[git_metrics]
format = "[ +$added ]($added_style)[ -$deleted ]($deleted_style)"
added_style = "fg:#4a8c5c bold"
deleted_style = "fg:#c92a2a bold"
disabled = false

[hg_branch]
format = "[ $symbol$branch ]($style)"
symbol = " "
style = "fg:#a8d3c5 bg:#3a7a8c"

[cmd_duration]
format = "[  $duration ]($style)"
style = "fg:#8fb3a5 bg:#0f1f1a"
min_time = 500

[character]
success_symbol = "[➜](fg:#4a8c5c bold) "
error_symbol = "[✗](fg:#c92a2a bold) "

[time]
disabled = false
time_format = "%R" # Hour:Minute Format
style = "fg:#0a1612 bg:#8fb3a5 bold"
format = "[ 󱑍 $time ]($style)"

[python]
format = '[ ${symbol}${pyenv_prefix}(${version} )(\($virtualenv\) )]($style)'
style = "fg:#0a1612 bg:#d4a017"
symbol = "🐍 "

[nodejs]
format = '[ ${symbol}(${version} )]($style)'
style = "fg:#0a1612 bg:#4a8c5c"
symbol = " "

[rust]
format = '[ ${symbol}(${version} )]($style)'
style = "fg:#0a1612 bg:#e85d04"
symbol = "🦀 "

[docker_context]
format = '[ ${symbol}${context} ]($style)'
style = "fg:#0a1612 bg:#3a7a8c"
symbol = "🐋 "
