# vim: ft=tmux
# NERV Theme for tmux statusline
set -g mode-style "fg=#a8d3c5,bg=#0f1f1a"

set -g message-style "fg=#a8d3c5,bg=#0f1f1a"
set -g message-command-style "fg=#a8d3c5,bg=#0f1f1a"

set -g pane-border-style "fg=#2a4a3d"
set -g pane-active-border-style "fg=#e85d04"

set -g status "on"
set -g status-interval 1
set -g status-justify "left"

set -g status-style "fg=#5a7a6d,bg=default"

set -g status-bg "default"

set -g status-left-length "100"
set -g status-right-length "100"

set -g status-left-style NONE
set -g status-right-style NONE
set -g status-left "#[fg=#0a1612,bg=#e85d04,bold] #S:#I.#P #[fg=#e85d04,bg=#8fb3a5,nobold,nounderscore,noitalics]#[fg=#0a1612,bg=#8fb3a5,bold] #(whoami) #[fg=#8fb3a5,bg=#0f1f1a]"
set -g status-right "#[fg=#5a7a6d,bg=#0f1f1a,nobold,nounderscore,noitalics]#[fg=#8fb3a5,bg=#5a7a6d]#[fg=#3a7a8c,bg=#5a7a6d,nobold,nounderscore,noitalics]#[fg=#a8d3c5,bg:#3a7a8c]#[fg=#8fb3a5,bg:#3a7a8c,nobold,nounderscore,noitalics]#[fg=#0a1612,bg=#e85d04,bold] #h "

setw -g window-status-activity-style "underscore,fg=#5a7a6d,bg=#0f1f1a"
setw -g window-status-separator ""
setw -g window-status-style "NONE,fg=#5a7a6d,bg=#0f1f1a"
setw -g window-status-format '#[fg=#0f1f1a,bg=#0f1f1a]#[default] #I  #{b:pane_current_path} #[fg=#0f1f1a,bg=#0f1f1a,nobold,nounderscore,noitalics]'
setw -g window-status-current-format '#[fg=#0f1f1a,bg=#a8d3c5]#[fg=#e85d04,bg=#a8d3c5] #I #[fg=#a8d3c5,bg=#e85d04] #{b:pane_current_path} #[fg=#e85d04,bg=#0f1f1a,nobold]'
