#set -g default-terminal "tmux-256color"
set -g default-terminal "xterm-256color"
#set -ga terminal-overrides ",*256col*:Tc"
set -g default-shell /bin/zsh
set -ga terminal-overrides ",xterm-256color:Tc"
# action key
unbind C-b
set-option -g prefix C-t
set-option -g repeat-time 0
set-option -g focus-events on

#### Key bindings

set-window-option -g mode-keys vi
set -g mouse on

#bind t send-key C-t
# Reload settings
# bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded!"
# Open current directory
bind o run-shell "open #{pane_current_path}"
bind -r e kill-pane -a

# vim-like pane switching
bind -r k select-pane -U 
bind -r j select-pane -D 
bind -r h select-pane -L 
bind -r l select-pane -R 

# Moving window
bind-key -n C-S-Left swap-window -t -1 \; previous-window
bind-key -n C-S-Right swap-window -t +1 \; next-window

# Resizing pane
bind -r C-k resize-pane -U 5
bind -r C-j resize-pane -D 5
bind -r C-h resize-pane -L 5
bind -r C-l resize-pane -R 5

# 3-column layout (1:2:1) with prefix + |
bind -r | run-shell "panes=\$(tmux list-panes -F \"#{pane_index}\" | wc -l | tr -d ' '); \
  if [ \"\$panes\" -lt 3 ]; then \
    while [ \"\$panes\" -lt 3 ]; do \
      tmux split-window -h -c \"#{pane_current_path}\"; \
      panes=\$((panes+1)); \
    done; \
  elif [ \"\$panes\" -gt 3 ]; then \
    tmux display-message \"1:2:1 layout needs exactly 3 panes (have \$panes)\"; \
    exit 0; \
  fi; \
  tmux select-layout even-horizontal; \
  width=\$(tmux display -p \"#{window_width}\"); \
  quarter=\$((width/4)); \
  half=\$((width/2)); \
  panes_sorted=\$(tmux list-panes -F \"#{pane_index} #{pane_left}\" | sort -n -k2); \
  left=\$(printf \"%s\n\" \"\$panes_sorted\" | head -n1 | cut -d' ' -f1); \
  mid=\$(printf \"%s\n\" \"\$panes_sorted\" | head -n2 | tail -n1 | cut -d' ' -f1); \
  right=\$(printf \"%s\n\" \"\$panes_sorted\" | head -n3 | tail -n1 | cut -d' ' -f1); \
  tmux resize-pane -t \"\$left\" -x \"\$quarter\"; \
  tmux resize-pane -t \"\$mid\" -x \"\$half\"; \
  tmux resize-pane -t \"\$right\" -x \"\$quarter\"; \
  tmux display-message \"Applied 1:2:1 columns\""

#### basic settings

set-option -g status-justify "left"
#set-option utf8-default on
#set-option -g mouse-select-pane
set-window-option -g mode-keys vi
#set-window-option -g utf8 on
# look'n feel
set-option -g status-style fg="#93a1a1",bg="#073642"
set-option -g status-bg "#073642"
set -g pane-active-border-style fg="#93a1a1"
set -g window-style fg="#839496",bg=default
set -g window-active-style fg="#93a1a1",bg=default
set-option -g history-limit 64096

set -sg escape-time 10

#### COLOUR

# default statusbar colors
set-option -g status-style fg="#93a1a1",bg="#073642"

# default window title colors
set-window-option -g window-status-style fg="#839496",bg="#073642"

# active window title colors
set-window-option -g window-status-current-style fg="#b58900",bg="#002b36"

# pane border
set-option -g pane-border-style fg="#073642"
set-option -g pane-active-border-style fg="#93a1a1"

# message text
set-option -g message-style fg="#93a1a1",bg="#073642"

# pane number display
set-option -g display-panes-active-colour "#93a1a1"
set-option -g display-panes-colour "#073642"

# clock
set-window-option -g clock-mode-colour "#93a1a1"

# allow the title bar to adapt to whatever host you connect to
set -g set-titles on
set -g set-titles-string "#T"

# import
if-shell "uname -s | grep -q Darwin" "source ~/.config/tmux/macos.conf"

# plugin
set -g @tpm_plugins 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-save 'v'
set -g @resurrect-restore 'r'

source ~/.config/tmux/statusline.conf
source ~/.config/tmux/utility.conf
run '~/.tmux/plugins/tpm/tpm'
